spring.application.name=backend-assignment

# Default local configuration uses H2 for testability in this environment.
# For a real local SQL Server database, activate the "mssql" profile.
spring.datasource.url=jdbc:h2:mem:TESTDB;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 console (optional for local inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.web=INFO
logging.level.com.interview.backend=INFO
logging.file.name=logs/api-requests.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
